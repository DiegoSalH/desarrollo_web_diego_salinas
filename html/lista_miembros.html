<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Lista de Miembros Registrados</title>
        <link rel="stylesheet" type="text/css" href="../css/lista.css">
    </head>
    <body>
        <main class="container">
            <header>
                <h1>Directorio de Miembros</h1>

                <nav>
                    <a href="main.html" class="btn-volver">Volver al menu</a>
                </nav>

            </header>
            
            <section class="controles-tabla">
                <div class="filtro">
                    <label for="filtro-rol">Filtrar por Rol:</label>
                    <select id="filtro-rol">
                        <option value="todos">Todos</option>
                        <option value="pregrado">Estudiante de Pregrado</option>
                        <option value="postgrado">Estudiante de Postgrado</option>
                        <option value="academico">Académico/a</option>
                        <option value="funcionario">Funcionario/a</option>
                    </select>
                </div>

                <div class="orden">
                    <label for="orden-datos">Ordenar por:</label>
                    <select id="orden-datos">
                        <option value="reciente">Más recientes primero</option>
                        <option value="antiguo">Más antiguos primero</option>
                        <option value="nombre-asc">Nombre (A - Z)</option>
                        <option value="nombre-desc">Nombre (Z - A)</option>
                    </select>
                </div>
            </section>

            <div class="tabla-contenedor">
                <table class="tabla-miembros">
                    <caption>Lista de los miembros registrados</caption>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Tipo de Miembro</th>
                            <th>Correo Institucional</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla">
                        </tbody>
                </table>
            </div>

            <footer class="paginacion">
                <button id="boton-anterior" disabled>Anterior</button>
                <span id="info-pagina">Pagina 1 de X</span>
                <button id="boton-siguiente">Siguiente</button>
            </footer>

        </main>
        <script src="../js/lista.js"></script>
    </body>
</html>
